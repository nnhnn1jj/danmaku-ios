name: build-ipa

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project DanmakuIOS.xcodeproj \
            -scheme DanmakuIOS \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DanmakuIOS.app Payload/
          zip -qry DanmakuIOS.ipa Payload
          ls -lh DanmakuIOS.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DanmakuIOS-ipa
          path: DanmakuIOS.ipa
          retention-days: 30
