name: DanmakuIOS
options:
  bundleIdPrefix: com.local.danmaku
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  DanmakuIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 弹幕助手
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.danmaku.assistant
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        ENABLE_BITCODE: "NO"

schemes:
  DanmakuIOS:
    build:
      targets:
        DanmakuIOS: all
    run:
      config: Debug
    archive:
      config: Release
